<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opportunity Scout</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,sans-serif;max-width:760px;margin:20px auto;padding:0 14px;line-height:1.45}
  h1{font-size:22px;margin:0 0 12px}
  .box{background:rgba(127,127,127,.12);border-radius:10px;padding:12px;margin:12px 0}
  .card{border:1px solid rgba(127,127,127,.35);border-radius:10px;padding:12px;margin:12px 0}
  .tag{display:inline-block;padding:2px 9px;border-radius:10px;background:rgba(127,127,127,.25);font-size:12px;margin-right:6px}
  button{font-size:15px;padding:10px 16px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer;margin:4px 6px 4px 0}
  button.grey{background:#6b7280}
  button:disabled{opacity:.5}
  input,select,textarea{font-size:15px;padding:8px;margin:3px 6px 3px 0;max-width:100%;box-sizing:border-box}
  textarea{width:100%;min-height:110px}
  .err{color:#dc2626} .ok{color:#16a34a} small{opacity:.75}
  form{margin-top:8px}
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var api = q.get("a") || "";
  var app = document.getElementById("app");
  // Only ever talk to a Supabase edge function URL (stops a crafted link from sending tokens elsewhere).
  var API_OK = /^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/[a-z0-9_-]+$/i;

  function h(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "text") node.textContent = props[k];
      else if (k === "onclick") node.onclick = props[k];
      else if (k === "onsubmit") node.onsubmit = props[k];
      else node.setAttribute(k, props[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  }
  function show() {
    app.textContent = "";
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) app.appendChild(arguments[i]);
  }
  function fail(msg) { show(h("h1", { text: "Something is wrong" }), h("p", { class: "err", text: msg })); }
  function post(path, body) {
    return fetch(api + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Unexpected response from the server" }; }); })
      .catch(function () { return { ok: false, error: "Could not reach the server" }; });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function money(v, c) { return v == null ? "" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " " + (c || "USD"); }
  function fmtMap(m) {
    var parts = Object.keys(m || {}).map(function (c) { return money(m[c], c); });
    return parts.length ? parts.join(", ") : "0";
  }
  function ledgerHref(t) { return "?a=" + encodeURIComponent(api) + "&view=ledger&t=" + encodeURIComponent(t); }

  // ---------- confirm page (opened from an email link) ----------
  function confirmPage() {
    var body = { id: Number(q.get("id")), do: q.get("do"), t: q.get("t") };
    post("/act", Object.assign({ preview: true }, body)).then(function (info) {
      if (!info.ok) return fail(info.error);
      var feedback = info.needs === "feedback" ? h("textarea", { placeholder: "e.g. Shorter. Focus on mobile money. Remove the budget section.", required: "required" }) : null;
      var btn = h("button", { type: "submit", text: "Confirm" });
      var msg = h("p");
      var form = h("form", { onsubmit: function (e) {
        e.preventDefault();
        if (feedback && !feedback.value.trim()) { msg.className = "err"; msg.textContent = "Please say what to change."; return; }
        btn.disabled = true; msg.className = ""; msg.textContent = "Working…";
        post("/act", Object.assign({ feedback: feedback ? feedback.value : undefined }, body)).then(function (r) {
          if (!r.ok) { btn.disabled = false; msg.className = "err"; msg.textContent = r.error; return; }
          show(h("h1", { class: "ok", text: r.message }), h("p", { text: r.title }),
            r.ledger_t ? h("p", null, h("a", { href: ledgerHref(r.ledger_t), text: "Open money ledger" })) : null);
        });
      } }, feedback, h("p", null, btn), msg);
      show(h("h1", { text: info.label }), h("p", null, h("b", { text: info.title })), form);
    });
  }

  // ---------- money ledger ----------
  function ledgerPage() {
    var t = q.get("t");
    post("/ledger", { t: t }).then(function (d) {
      if (!d.ok) return fail(d.error);
      var s = d.summary, counts = s.counts || {};
      var pipeline = ["drafted", "approved", "submitted", "won", "lost", "paid", "skipped"]
        .filter(function (k) { return counts[k]; }).map(function (k) { return counts[k] + " " + k; }).join(" · ") || "nothing yet";
      var recv = Object.keys(s.received || {}).map(function (a) { return a + ": " + fmtMap(s.received[a]); }).join(" | ") || "0";
      var notice = h("p");
      var list = h("div");

      function act(row, action, extra, btn) {
        btn.disabled = true; notice.className = ""; notice.textContent = "Saving…";
        post("/act", Object.assign({ id: row.opportunity_id, do: action, t: row.actions[action] }, extra)).then(function (r) {
          if (!r.ok) { btn.disabled = false; notice.className = "err"; notice.textContent = r.error; return; }
          ledgerPage();
        });
      }
      function field(name, attrs) { var i = h("input", Object.assign({ name: name }, attrs)); return i; }

      d.rows.forEach(function (row) {
        var link = safeUrl(row.url);
        var card = h("div", { class: "card" },
          h("div", null, link ? h("a", { href: link, target: "_blank", rel: "noopener", text: row.title }) : h("b", { text: row.title })),
          h("div", null, h("span", { class: "tag", text: row.status }), row.category ? h("span", { class: "tag", text: row.category }) : null,
            row.deadline ? h("small", { text: "closes " + String(row.deadline).slice(0, 10) }) : null),
          row.amount != null ? h("div", { text: money(row.amount, row.currency) + (row.payout_method ? "  ·  " + row.payout_method : "") + (row.payout_account ? " → " + row.payout_account : "") }) : null
        );
        var a = row.actions || {};
        if (a.submitted) {
          var b1 = h("button", { type: "button", text: "I submitted this" });
          b1.onclick = function () { act(row, "submitted", {}, b1); };
          card.appendChild(b1);
        }
        if (a.won) {
          var amt = field("amount", { placeholder: "amount won", size: "10", inputmode: "decimal" });
          var cu = field("currency", { size: "4", value: row.currency || "USD" });
          var bw = h("button", { type: "button", text: "Won" });
          bw.onclick = function () { act(row, "won", { amount: amt.value, currency: cu.value }, bw); };
          card.appendChild(h("div", null, amt, cu, bw));
        }
        if (a.lost) {
          var bl = h("button", { type: "button", class: "grey", text: "Lost" });
          bl.onclick = function () { act(row, "lost", {}, bl); };
          card.appendChild(bl);
        }
        if (a.paid) {
          var pa = field("amount", { placeholder: "amount received", size: "10", inputmode: "decimal", value: row.status === "won" && row.amount != null ? row.amount : "" });
          var pc = field("currency", { size: "4", value: row.currency || "USD" });
          var pm = h("select", null, h("option", { text: "Bank transfer" }), h("option", { text: "Mobile money" }), h("option", { text: "PayPal" }), h("option", { text: "Cloud credits" }), h("option", { text: "Other" }));
          var pk = h("select", null, h("option", { value: "company", text: "Company account" }), h("option", { value: "personal", text: "Personal account" }), h("option", { value: "none", text: "No account (credits)" }));
          var bp = h("button", { type: "button", text: "Paid" });
          bp.onclick = function () { act(row, "paid", { amount: pa.value, currency: pc.value, method: pm.value, account: pk.value }, bp); };
          card.appendChild(h("div", null, pa, pc, pm, pk, bp));
        }
        list.appendChild(card);
      });
      if (!d.rows.length) list.appendChild(h("p", { text: "Nothing yet. Items appear here once you draft or skip one." }));

      show(h("h1", { text: "Money ledger" }),
        h("div", { class: "box" },
          h("div", null, h("b", { text: "Pipeline: " }), pipeline),
          h("div", null, h("b", { text: "Won, awaiting payment: " }), fmtMap(s.awaiting)),
          h("div", null, h("b", { text: "Received by account: " }), recv)),
        notice, list);
    });
  }

  if (!API_OK.test(api)) return fail("This link is missing a valid server address. Open the link from the latest scout email.");
  if (q.get("view") === "ledger") ledgerPage();
  else if (q.get("id") && q.get("do") && q.get("t")) confirmPage();
  else fail("Open this page from a link in a scout email.");
})();
</script>
</body>
</html>
