<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>Opportunity Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#121c25; --panel:#1b2731; --panel-2:#17222b; --line:#34414f; --badge:#232f3a;
    --lav:#e8e2fc; --ink:#121c25; --text:#efeaf9; --muted:#999bad; --link:#b9a8ff;
    --good:#15803d; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;font-size:15px}
  main{max-width:780px;margin:0 auto;padding:18px 16px 40px}
  a{color:var(--link)}
  small{color:var(--muted)}
  .brand{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .brand b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav)}
  .brand nav a{font-size:13px;margin-left:14px;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
  .brand nav a.on,.brand nav a:hover{color:var(--lav);border-bottom-color:var(--lav)}
  .panel{border:1px solid var(--line);background:var(--panel);margin:22px 0}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--lav);color:var(--ink);font-weight:700;font-size:18px;padding:13px 16px}
  .count{background:var(--badge);color:#9fb3c8;font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px 8px;min-width:24px;text-align:center}
  .panel-b{padding:16px}
  .empty{border:1px dashed var(--line);padding:28px 16px;text-align:center}
  .empty-t{font-weight:700;font-size:14px;margin-bottom:6px}
  .empty-s{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto}
  .card{border:1px solid var(--line);background:var(--panel-2);padding:14px;margin:12px 0}
  .card:first-child{margin-top:0}
  .tag{display:inline-block;padding:2px 9px;background:var(--badge);color:#b6c4d3;font-size:12px;margin:0 6px 4px 0}
  .badge{display:inline-block;padding:2px 9px;font-size:12px;margin:0 6px 4px 0;color:#fff;font-weight:500}
  .good{background:var(--good)} .warn{background:var(--warn)} .bad{background:var(--bad)}
  .score{font-weight:700;font-size:20px;margin-right:10px;color:var(--lav)}
  .elig{font-size:13px;color:#c9c5da;margin:6px 0}
  button{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border:1px solid var(--lav);background:var(--lav);color:var(--ink);cursor:pointer;margin:6px 8px 0 0}
  button.grey{background:transparent;color:var(--lav);border-color:var(--line)}
  button:disabled{opacity:.5;cursor:default}
  button,select,input:not([type=range]):not([type=checkbox]){min-height:40px;line-height:1.25}
  .chip{min-height:34px;line-height:1.2}
  input[type=range]{min-height:24px;width:180px}
  input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:8px 10px;margin:4px 8px 4px 0;max-width:100%;border-radius:0}
  input[type=range]{padding:0;accent-color:var(--lav);vertical-align:middle}
  input[type=checkbox]{margin-right:4px;accent-color:var(--lav)}
  textarea{width:100%;min-height:120px}
  input:focus,select:focus,textarea:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--lav);outline-offset:1px}
  .chip{font:inherit;font-weight:500;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--text);margin:4px 6px 0 0;cursor:pointer}
  .chip.on{background:var(--lav);color:var(--ink);border-color:var(--lav)}
  .err{color:#f87171} .ok{color:#4ade80}
  .stat{margin:4px 0}
  form{margin-top:8px}
  label{font-size:13px;color:var(--muted);margin-right:12px}
  @media (max-width:520px){.panel-h{font-size:16px}.score{font-size:18px}}
</style>
</head>
<body>
<main id="app"><div class="panel"><div class="panel-h"><span>Loading</span></div><div class="panel-b"><p>Loading…</p></div></div></main>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var api = q.get("a") || "";
  var app = document.getElementById("app");
  // Only ever talk to a Supabase edge function URL (stops a crafted link from sending tokens elsewhere).
  var API_OK = /^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/[a-z0-9_-]+$/i;

  function h(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "text") node.textContent = props[k];
      else if (k === "onclick") node.onclick = props[k];
      else if (k === "onsubmit") node.onsubmit = props[k];
      else node.setAttribute(k, props[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  }
  function show() {
    app.textContent = "";
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) app.appendChild(arguments[i]);
  }
  // A panel: lavender header bar (title + optional count badge) over a dark body.
  function panel(title, count) {
    var head = h("div", { class: "panel-h" }, h("span", { text: title }));
    if (count != null) head.appendChild(h("span", { class: "count", text: String(count) }));
    var body = h("div", { class: "panel-b" });
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) body.appendChild(arguments[i]);
    return h("section", { class: "panel" }, head, body);
  }
  function empty(title, sub) {
    return h("div", { class: "empty" }, h("div", { class: "empty-t", text: title }), h("div", { class: "empty-s", text: sub }));
  }
  function brand(active, listT, ledgerT) {
    var nav = h("nav");
    if (listT) nav.appendChild(h("a", { href: "?a=" + encodeURIComponent(api) + "&view=browse&t=" + encodeURIComponent(listT), class: active === "browse" ? "on" : "", text: "Opportunities" }));
    if (ledgerT) nav.appendChild(h("a", { href: "?a=" + encodeURIComponent(api) + "&view=ledger&t=" + encodeURIComponent(ledgerT), class: active === "ledger" ? "on" : "", text: "Money ledger" }));
    return h("div", { class: "brand" }, h("b", { text: "Opportunity Scout" }), nav);
  }
  function fail(msg) { show(brand(), panel("Something is wrong", null, h("p", { class: "err", text: msg }))); }
  function post(path, body) {
    return fetch(api + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: "Unexpected response from the server" }; }); })
      .catch(function () { return { ok: false, error: "Could not reach the server" }; });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function money(v, c) { return v == null ? "" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " " + (c || "USD"); }
  function fmtMap(m) {
    var parts = Object.keys(m || {}).map(function (c) { return money(m[c], c); });
    return parts.length ? parts.join(", ") : "0";
  }
  function ledgerHref(t) { return "?a=" + encodeURIComponent(api) + "&view=ledger&t=" + encodeURIComponent(t); }

  // ---------- confirm page (opened from an email link) ----------
  function confirmPage() {
    var body = { id: Number(q.get("id")), do: q.get("do"), t: q.get("t") };
    post("/act", Object.assign({ preview: true }, body)).then(function (info) {
      if (!info.ok) return fail(info.error);
      var feedback = info.needs === "feedback" ? h("textarea", { placeholder: "e.g. Shorter. Focus on mobile money. Remove the budget section.", required: "required" }) : null;
      var btn = h("button", { type: "submit", text: "Confirm" });
      var msg = h("p");
      var form = h("form", { onsubmit: function (e) {
        e.preventDefault();
        if (feedback && !feedback.value.trim()) { msg.className = "err"; msg.textContent = "Please say what to change."; return; }
        btn.disabled = true; msg.className = ""; msg.textContent = "Working…";
        post("/act", Object.assign({ feedback: feedback ? feedback.value : undefined }, body)).then(function (r) {
          if (!r.ok) { btn.disabled = false; msg.className = "err"; msg.textContent = r.error; return; }
          show(brand(null, null, r.ledger_t), panel("Done", null, h("p", { class: "ok", text: r.message }), h("p", { text: r.title }),
            r.ledger_t ? h("p", null, h("a", { href: ledgerHref(r.ledger_t), text: "Open money ledger" })) : null));
        });
      } }, feedback, h("p", null, btn), msg);
      show(brand(), panel("Confirm", null, h("p", null, h("b", { text: info.label })), h("p", { text: info.title }), form));
    });
  }

  // ---------- browse and filter all opportunities ----------
  function browsePage() {
    var t = q.get("t");
    post("/list", { t: t }).then(function (d) {
      if (!d.ok) return fail(d.error);
      var rows = d.rows || [];
      var state = { reg: "ok", cats: {}, effort: "any", min: 50, sort: "score", text: "", skipped: false };
      var list = h("div");
      var count = h("p", { class: "stat" });
      var notice = h("p");
      var badgeEl = h("span", { class: "count", text: "0" });

      function visible(r) {
        if (!state.skipped && r.status === "skipped") return false;
        if (state.reg === "ok" && r.registration === "required") return false;
        if (state.reg === "strict" && r.registration !== "not_required") return false;
        if ((r.score || 0) < state.min) return false;
        if (state.effort === "low" && r.effort !== "low") return false;
        if (state.effort === "lowmed" && r.effort === "high") return false;
        var cats = Object.keys(state.cats).filter(function (k) { return state.cats[k]; });
        if (cats.length && cats.indexOf(r.category) < 0) return false;
        if (state.text) {
          var hay = ((r.title || "") + " " + (r.eligibility || "") + " " + (r.reason || "")).toLowerCase();
          if (hay.indexOf(state.text) < 0) return false;
        }
        return true;
      }
      function sorter(a, b) {
        if (state.sort === "deadline") {
          var x = a.deadline ? Date.parse(a.deadline) : Infinity, y = b.deadline ? Date.parse(b.deadline) : Infinity;
          return x - y || (b.score || 0) - (a.score || 0);
        }
        if (state.sort === "newest") return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0);
        return (b.score || 0) - (a.score || 0);
      }
      function badge(r) {
        if (r.registration === "not_required") return h("span", { class: "badge good", text: "No company needed" });
        if (r.registration === "required") return h("span", { class: "badge bad", text: "Registered company required" });
        return h("span", { class: "badge warn", text: "Eligibility unclear" });
      }
      function act(r, action, btn) {
        btn.disabled = true; notice.className = ""; notice.textContent = "Working…";
        post("/act", { id: r.id, do: action, t: r.actions[action] }).then(function (res) {
          if (!res.ok) { btn.disabled = false; notice.className = "err"; notice.textContent = res.error; return; }
          notice.className = "ok"; notice.textContent = res.message;
          if (action === "skip") { r.status = "skipped"; r.actions = {}; }
          if (action === "draft") { r.status = "drafted"; }
          render();
        });
      }
      function render() {
        var shown = rows.filter(visible).sort(sorter);
        count.textContent = shown.length + " shown of " + rows.length;
        badgeEl.textContent = String(shown.length);
        list.textContent = "";
        shown.forEach(function (r) {
          var link = safeUrl(r.url);
          var card = h("div", { class: "card" },
            h("div", null, h("span", { class: "score", text: String(r.score == null ? "" : r.score) }),
              link ? h("a", { href: link, target: "_blank", rel: "noopener", text: r.title }) : h("b", { text: r.title })),
            h("div", { style: "margin-top:6px" }, badge(r), r.category ? h("span", { class: "tag", text: r.category }) : null,
              r.effort ? h("span", { class: "tag", text: r.effort + " effort" }) : null,
              r.status && r.status !== "found" ? h("span", { class: "tag", text: r.status }) : null,
              r.deadline ? h("small", { text: "closes " + String(r.deadline).slice(0, 10) }) : null),
            r.eligibility ? h("div", { class: "elig", text: "Who can apply: " + r.eligibility }) : null,
            r.reason ? h("small", { text: r.reason }) : null);
          var a = r.actions || {};
          var row = h("div");
          if (a.draft) { var bd = h("button", { type: "button", text: r.status === "drafted" ? "Draft again" : "Draft application" }); bd.onclick = function () { act(r, "draft", bd); }; row.appendChild(bd); }
          if (a.skip) { var bs = h("button", { type: "button", class: "grey", text: "Skip" }); bs.onclick = function () { act(r, "skip", bs); }; row.appendChild(bs); }
          card.appendChild(row);
          list.appendChild(card);
        });
        if (!shown.length) list.appendChild(empty("Nothing matches these filters", "Try showing everything, or lowering the minimum score."));
      }

      var reg = h("select", null, h("option", { value: "ok", text: "No company needed, or unclear" }),
        h("option", { value: "strict", text: "Confirmed no company needed" }), h("option", { value: "all", text: "Show everything" }));
      reg.onchange = function () { state.reg = reg.value; render(); };
      var eff = h("select", null, h("option", { value: "any", text: "Any effort" }), h("option", { value: "lowmed", text: "Low or medium effort" }), h("option", { value: "low", text: "Low effort only" }));
      eff.onchange = function () { state.effort = eff.value; render(); };
      var srt = h("select", null, h("option", { value: "score", text: "Best score" }), h("option", { value: "deadline", text: "Closing soonest" }), h("option", { value: "newest", text: "Newest" }));
      srt.onchange = function () { state.sort = srt.value; render(); };
      var min = h("input", { type: "range", min: "0", max: "100", value: "50" });
      var minLabel = h("small", { text: "min score 50" });
      min.oninput = function () { state.min = Number(min.value); minLabel.textContent = "min score " + min.value; render(); };
      var search = h("input", { type: "search", placeholder: "Search title or who can apply", style: "width:100%" });
      search.oninput = function () { state.text = search.value.trim().toLowerCase(); render(); };
      var skp = h("input", { type: "checkbox" });
      skp.onchange = function () { state.skipped = skp.checked; render(); };

      var chips = h("div");
      var cats = {};
      rows.forEach(function (r) { if (r.category) cats[r.category] = true; });
      Object.keys(cats).sort().forEach(function (c) {
        var chip = h("button", { type: "button", class: "chip", text: c });
        chip.onclick = function () { state.cats[c] = !state.cats[c]; chip.className = state.cats[c] ? "chip on" : "chip"; render(); };
        chips.appendChild(chip);
      });

      var filters = panel("Filters", null,
        h("div", null, reg, eff, srt),
        h("div", null, h("label", null, min, " ", minLabel), h("label", null, skp, " show skipped")),
        h("div", null, search), chips);
      var results = h("section", { class: "panel" },
        h("div", { class: "panel-h" }, h("span", { text: "Opportunities" }), badgeEl),
        h("div", { class: "panel-b" }, count, notice, list));
      show(brand("browse", t, d.ledger_t), filters, results);
      render();
    });
  }

  // ---------- money ledger ----------
  function ledgerPage() {
    var t = q.get("t");
    post("/ledger", { t: t }).then(function (d) {
      if (!d.ok) return fail(d.error);
      var s = d.summary, counts = s.counts || {};
      var pipeline = ["drafted", "approved", "submitted", "won", "lost", "paid", "skipped"]
        .filter(function (k) { return counts[k]; }).map(function (k) { return counts[k] + " " + k; }).join(" · ") || "nothing yet";
      var recv = Object.keys(s.received || {}).map(function (a) { return a + ": " + fmtMap(s.received[a]); }).join(" | ") || "0";
      var notice = h("p");
      var list = h("div");

      function act(row, action, extra, btn) {
        btn.disabled = true; notice.className = ""; notice.textContent = "Saving…";
        post("/act", Object.assign({ id: row.opportunity_id, do: action, t: row.actions[action] }, extra)).then(function (r) {
          if (!r.ok) { btn.disabled = false; notice.className = "err"; notice.textContent = r.error; return; }
          ledgerPage();
        });
      }
      function field(name, attrs) { return h("input", Object.assign({ name: name }, attrs)); }

      d.rows.forEach(function (row) {
        var link = safeUrl(row.url);
        var card = h("div", { class: "card" },
          h("div", null, link ? h("a", { href: link, target: "_blank", rel: "noopener", text: row.title }) : h("b", { text: row.title })),
          h("div", { style: "margin-top:6px" }, h("span", { class: "tag", text: row.status }), row.category ? h("span", { class: "tag", text: row.category }) : null,
            row.deadline ? h("small", { text: "closes " + String(row.deadline).slice(0, 10) }) : null),
          row.amount != null ? h("div", { text: money(row.amount, row.currency) + (row.payout_method ? "  ·  " + row.payout_method : "") + (row.payout_account ? " → " + row.payout_account : "") }) : null
        );
        var a = row.actions || {};
        if (a.submitted) {
          var b1 = h("button", { type: "button", text: "I submitted this" });
          b1.onclick = function () { act(row, "submitted", {}, b1); };
          card.appendChild(b1);
        }
        if (a.won) {
          var amt = field("amount", { placeholder: "amount won", size: "10", inputmode: "decimal" });
          var cu = field("currency", { size: "4", value: row.currency || "USD" });
          var bw = h("button", { type: "button", text: "Won" });
          bw.onclick = function () { act(row, "won", { amount: amt.value, currency: cu.value }, bw); };
          card.appendChild(h("div", null, amt, cu, bw));
        }
        if (a.lost) {
          var bl = h("button", { type: "button", class: "grey", text: "Lost" });
          bl.onclick = function () { act(row, "lost", {}, bl); };
          card.appendChild(bl);
        }
        if (a.paid) {
          var pa = field("amount", { placeholder: "amount received", size: "10", inputmode: "decimal", value: row.status === "won" && row.amount != null ? row.amount : "" });
          var pc = field("currency", { size: "4", value: row.currency || "USD" });
          var pm = h("select", null, h("option", { text: "Bank transfer" }), h("option", { text: "Mobile money" }), h("option", { text: "PayPal" }), h("option", { text: "Cloud credits" }), h("option", { text: "Other" }));
          var pk = h("select", null, h("option", { value: "company", text: "Company account" }), h("option", { value: "personal", text: "Personal account" }), h("option", { value: "none", text: "No account (credits)" }));
          var bp = h("button", { type: "button", text: "Paid" });
          bp.onclick = function () { act(row, "paid", { amount: pa.value, currency: pc.value, method: pm.value, account: pk.value }, bp); };
          card.appendChild(h("div", null, pa, pc, pm, pk, bp));
        }
        list.appendChild(card);
      });
      if (!d.rows.length) list.appendChild(empty("No items yet", "Items appear here once you draft or skip one."));

      show(brand("ledger", d.list_t, t),
        panel("Summary", null,
          h("div", { class: "stat" }, h("b", { text: "Pipeline: " }), pipeline),
          h("div", { class: "stat" }, h("b", { text: "Won, awaiting payment: " }), fmtMap(s.awaiting)),
          h("div", { class: "stat" }, h("b", { text: "Received by account: " }), recv)),
        panel("Money ledger", d.rows.length, notice, list));
    });
  }

  if (!API_OK.test(api)) return fail("This link is missing a valid server address. Open the link from the latest scout email.");
  if (q.get("view") === "browse") browsePage();
  else if (q.get("view") === "ledger") ledgerPage();
  else if (q.get("id") && q.get("do") && q.get("t")) confirmPage();
  else fail("Open this page from a link in a scout email.");
})();
</script>
</body>
</html>
